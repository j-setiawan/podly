name: Build Podly Tesla P4 Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENCE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENCE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/podly
  PYTORCH_VERSION: 2.5.1
  PYTORCH_CUDA_TAG: cu124

jobs:
  build-podly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space for CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build and publish Tesla P4 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The official wheel includes sm_60 cubins. CUDA guarantees that they
          # execute on the Tesla P4's higher-minor sm_61 architecture.
          build-args: |
            BASE_IMAGE=nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
            USE_GPU=true
            USE_GPU_NVIDIA=true
            USE_GPU_AMD=false
            LITE_BUILD=false
            PYTORCH_VERSION=${{ env.PYTORCH_VERSION }}
            PYTORCH_CUDA_TAG=${{ env.PYTORCH_CUDA_TAG }}
            REQUIRE_CUDA_ARCH=sm_60
